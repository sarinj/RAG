[project]
name = "learning-rag-llm-backend"
version = "0.1.0"
description = "Internal RAG API and ingestion worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.0,<2",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1,<2",
    "pypdf>=5,<7",
    "rank-bm25>=0.2,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tokenizers>=0.21,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "respx>=0.21,<1",
    "ruff>=0.9,<1",
]
eval = [
    "langchain-community>=0.3,<0.4",
    "openai>=2,<3",
    "ragas>=0.4,<0.5",
]

[project.scripts]
rag-probe = "rag_app.probe:main"
rag-worker = "rag_app.worker:main"
rag-eval = "rag_app.evals.runner:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_app"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
